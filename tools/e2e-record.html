<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/styles/app.css"></head>
<body><main id="app" class="app"></main><pre id="log"></pre>
<script type="module">
/*
 * 기록 흐름 E2E. "에러 안 남"과 "의도대로 됨"은 다르다.
 *
 * 기대값을 숫자로 박아 두지 않고 domain 에서 계산해 쓴다. 기본 점수표가 바뀌면
 * 예전 테스트는 150 같은 상수를 붙들고 엉뚱하게 실패한다.
 */
const log = [];
const ok = (name, cond, extra = '') => log.push(`${cond ? 'PASS' : 'FAIL'} ${name}${extra ? ' — ' + extra : ''}`);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

localStorage.clear();
// 검증용 페이지는 서버에 붙지 않는다. 붙으면 가짜 기록이 진짜 방으로 올라간다.
localStorage.setItem('climbing-score/sync', 'off');
const { createGym } = await import('../src/domain/gym.js');
const { scoreFor } = await import('../src/domain/scoring.js');
const gym = createGym({ name: '테스트짐', gu: '강남구', grades: [
  { label: '빨강', color: '#E23B34' }, { label: '노랑', color: '#F2C41D' },
  { label: '초록', color: '#3FA45B' }, { label: '파랑', color: '#2F7DD1' },
]});
gym.favorite = true;
const today = new Date().toISOString().slice(0, 10);
localStorage.setItem('climbing-score/v1', JSON.stringify({
  profiles: [
    { id: 'p1', name: '가', level: 1, primaryGymId: gym.id, createdAt: today },
    { id: 'p2', name: '나', level: 1, primaryGymId: gym.id, createdAt: today },
  ],
  gyms: [gym], sessions: [], meta: { version: 1, seeded: true },
}));

await import('../src/app.js');
await wait(400);

const grades = gym.grades.slice().sort((a, b) => a.order - b.order);
const 초록 = grades[2];
const 파랑 = grades[3];
const unit = (grade) => scoreFor(gym.scoreTable, 1, grade);
const num = (s) => Number((s ?? '').replace(/[^\d]/g, ''));

const rows = () => [...document.querySelectorAll('.grid__row')];
const cell = (r, c) => rows()[r]?.querySelectorAll('.cell')[c];
const score = (c) => num(document.querySelectorAll('.grid__person .grid__score')[c]?.textContent);
const tap = (el) => {
  el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerId: 1 }));
  el.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 1 }));
};

ok('부팅 시 기본 짐 자동 선택', document.querySelector('.matchbar__name')?.textContent === '테스트짐');
ok('난이도 4행 렌더', rows().length === 4, `실제 ${rows().length}`);
ok('참가자 2열 렌더', document.querySelectorAll('.cell').length === 8,
   `실제 ${document.querySelectorAll('.cell').length}`);

tap(cell(2, 0)); await wait(150);
ok('탭하면 그 사람 점수가 오른다', score(0) === unit(초록), `가=${score(0)} 기대=${unit(초록)}`);
ok('옆 사람 점수는 그대로', score(1) === 0, `나=${score(1)}`);

tap(cell(2, 0)); await wait(150);
ok('두 번 탭하면 누적된다', score(0) === unit(초록) * 2, `가=${score(0)}`);
ok('칸에 개수가 보인다', cell(2, 0).querySelector('.cell__count')?.textContent === '2');
ok('칸에 개당 점수도 함께 보인다',
   cell(2, 0).querySelector('.cell__unit')?.textContent === `+${unit(초록).toLocaleString('ko-KR')}점`,
   cell(2, 0).querySelector('.cell__unit')?.textContent);

const saved = JSON.parse(localStorage.getItem('climbing-score/v1'));
ok('세션이 저장된다', saved.sessions.length === 1, `${saved.sessions.length}개`);
ok('기록 시점 레벨이 스냅샷된다', saved.sessions[0].levelAtTime === 1);

tap(cell(3, 1)); await wait(150);
ok('다른 사람 칸은 그 사람에게만 쌓인다', score(1) === unit(파랑), `나=${score(1)}`);
const ranks = [...document.querySelectorAll('.grid__rank')].map((e) => e.textContent);
ok('순위 배지가 둘 다 나온다', ranks.length === 2, ranks.join(','));
ok('점수가 높은 쪽이 1위', ranks[score(0) > score(1) ? 0 : 1] === '1위', ranks.join(','));

/*
 * 실제 브라우저는 손을 뗄 때 '지금 손가락 아래에 있는' 요소로 pointerup 을 보낸다.
 * 누르고 있는 사이 화면이 다시 그려졌다면 그건 처음 누른 그 요소가 아니다.
 *
 * 예전에는 처음 잡아 둔 참조에 그대로 쐈다. 떨어져 나간 요소도 자기 리스너는
 * 그대로 들고 있으니 정리 코드가 늘 불렸고, 그래서 "꾹 눌러 0 으로 만든 뒤
 * 클릭이 안 되는" 진짜 버그를 이 자리에서 한 번도 잡지 못했다.
 * 놓을 때 다시 찾는다.
 */
const hold = (get, ms = 600) => new Promise((r) => {
  const start = typeof get === 'function' ? get() : get;
  start.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerId: 1 }));
  setTimeout(() => {
    const now = (typeof get === 'function' ? get() : null) ?? start;
    now.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 1 }));
    r();
  }, ms);
});
/*
 * 근본 불변식: 개수가 바뀌어도 칸은 같은 DOM 노드로 남는다.
 *
 * 예전에는 render() 가 clear(root) 로 전부 부수고 새로 만들었다. 완등 +1
 * 한 번에 176개 칸이 교체되니, 누르고 있던 셀이 사라져 pointerup 이 영영
 * 오지 않았고 감소 인터벌이 죽지 않았다. 그 위에 붙는 증상들(꾹 눌러 0 으로
 * 만든 뒤 탭이 안 먹음)을 하나씩 막는 대신, 여기서 뿌리를 지킨다.
 */
const beforeNode = cell(2, 0);
tap(cell(2, 0)); await wait(250);
ok('탭해도 칸이 같은 노드로 남는다', cell(2, 0) === beforeNode);
ok('탭하면 +1', score(0) === unit(초록) * 3, `가=${score(0)}`);

/*
 * 1초를 붙들고 있어도 하나만 줄어든다.
 *
 * 예전에는 250ms 까지 아무 반응이 없다가 450/650/850ms 에 연달아 줄어,
 * 1초면 세 개가 쓸려 나갔다. 두 개짜리는 눈 깜짝할 사이에 사라진다.
 * 지금은 임계점에서 한 번 줄이고 한 박자 쉰다 — 화면에 적힌 "길게 누르면 −1"
 * 그대로다. 600ms 만 재면 옛 동작도 통과하므로 여기서는 1초를 잰다.
 */
await hold(() => cell(2, 0), 1000); await wait(250);
ok('1초를 눌러도 하나만 줄어든다', score(0) === unit(초록) * 2,
   `가=${score(0)} 기대=${unit(초록) * 2}`);
tap(cell(2, 0)); await wait(200);   // 뒤 단정들이 보던 상태로 되돌린다

await hold(() => cell(2, 0)); await wait(250);
ok('길게 누르면 −1', score(0) === unit(초록) * 2, `가=${score(0)} 기대=${unit(초록) * 2}`);
ok('길게 눌러도 칸이 같은 노드로 남는다', cell(2, 0) === beforeNode);

await hold(() => cell(2, 0)); await wait(250);
ok('길게 누르면 −1 (두 번째)', score(0) === unit(초록), `가=${score(0)} 기대=${unit(초록)}`);

/*
 * 꾹 눌러 0 으로 만든 뒤에도 탭이 먹어야 한다.
 *
 * 예전에는 손 떼기를 셀 자신에게서 받았다. 반복 감소가 한 번 돌면 화면을
 * 다시 그려 그 셀이 DOM 에서 사라지고, pointerup 은 영영 오지 않아
 * clearInterval 이 불리지 않았다. 200ms 마다 bump(-1) 과 전체 렌더가
 * 영원히 돌면서 이후의 탭을 전부 삼켰다.
 */
await hold(() => cell(2, 0)); await wait(300);          // 남은 개수를 0 으로
const zeroAt = score(0);
const domBefore = document.querySelectorAll('.cell').length;
let churn = 0;
const mo = new MutationObserver(() => { churn++; });
mo.observe(document.getElementById('app'), { childList: true, subtree: true });
await wait(700);
mo.disconnect();
ok('손을 뗀 뒤에는 화면이 저절로 다시 그려지지 않는다', churn === 0, `${churn}회`);
ok('0 까지 줄어든다', zeroAt === 0, `${zeroAt}점`);

cell(2, 0).dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerId: 1 }));
await wait(60);
cell(2, 0).dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 1 }));
await wait(300);
ok('0 으로 만든 뒤에도 탭이 먹는다', score(0) === unit(초록),
   `가=${score(0)} 기대=${unit(초록)}`);

// 별을 눌러도 모달이 겹치지 않는가
// (예전에는 즐겨찾기 갱신을 openGymPicker 재호출로 해서 누를 때마다 한 겹씩 쌓였다)
document.querySelector('.matchbar__gym').click(); await wait(400);
ok('짐 선택기가 하나만 열린다', document.querySelectorAll('.modal').length === 1);
const rowsBefore = document.querySelectorAll('.gymrow').length;
document.querySelector('.gymrow__star').click(); await wait(400);
ok('별을 눌러도 모달이 겹치지 않는다', document.querySelectorAll('.modal').length === 1,
   `${document.querySelectorAll('.modal').length}개`);
ok('목록이 늘어나지 않는다', document.querySelectorAll('.gymrow').length === rowsBefore,
   `${rowsBefore} -> ${document.querySelectorAll('.gymrow').length}`);
// 이 짐은 시드에서 이미 즐겨찾기라 별을 누르면 '자주 가는 곳'에서 빠진다.
// 중요한 건 방향이 아니라 목록이 제자리에서 다시 그려졌는가다.
ok('별을 누르면 목록이 제자리에서 갱신된다',
   ![...document.querySelectorAll('.gymsec__title')].some((e) => e.textContent.includes('자주 가는 곳')),
   [...document.querySelectorAll('.gymsec__title')].map((e) => e.textContent).join(' / '));

document.getElementById('log').textContent = log.join('\n');
document.body.dataset.done = '1';
</script></body></html>
