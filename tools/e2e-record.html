<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/styles/app.css"></head>
<body><main id="app" class="app"></main><pre id="log"></pre>
<script type="module">
const log = [];
const ok = (name, cond, extra='') => log.push(`${cond ? 'PASS' : 'FAIL'} ${name}${extra ? ' — ' + extra : ''}`);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

localStorage.clear();
const { createGym } = await import('../src/domain/gym.js');
const gym = createGym({ name: '테스트짐', gu: '강남구', grades: [
  { label: '빨강', color: '#E23B34' }, { label: '노랑', color: '#F2C41D' },
  { label: '초록', color: '#3FA45B' }, { label: '파랑', color: '#2F7DD1' },
]});
gym.favorite = true;
const today = new Date().toISOString().slice(0, 10);
localStorage.setItem('climbing-score/v1', JSON.stringify({
  profiles: [
    { id:'p1', name:'가', level:1, primaryGymId: gym.id, createdAt:today },
    { id:'p2', name:'나', level:1, primaryGymId: gym.id, createdAt:today },
  ],
  gyms: [gym], sessions: [], meta: { version:1, seeded:true },
}));

await import('../src/app.js');
await wait(400);

// 1) 부팅 시 즐겨찾기 짐이 자동 선택되는가
ok('부팅 시 기본 짐 자동 선택', document.querySelector('.matchbar__name')?.textContent === '테스트짐');

// 2) 난이도 카드 탭 → +1
const cards = () => [...document.querySelectorAll('.gcard')];
ok('난이도 카드 4개 렌더', cards().length === 4, `실제 ${cards().length}`);

const tap = (el) => {
  el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
  el.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }));
};

tap(cards()[2]); await wait(120);            // 초록(order2), LV1 → 150점
let total = document.querySelector('.total__score');
ok('탭하면 총점이 오른다', total?.dataset.value === '150', `값=${total?.dataset.value}`);

tap(cards()[2]); await wait(120);
ok('두 번 탭하면 누적된다', document.querySelector('.total__score')?.dataset.value === '300');

// 3) localStorage에 저장되는가
const saved = JSON.parse(localStorage.getItem('climbing-score/v1'));
ok('세션이 저장된다', saved.sessions.length === 1 && saved.sessions[0].levelAtTime === 1);
ok('기록 시점 레벨이 스냅샷된다', saved.sessions[0].levelAtTime === 1);

// 4) 스코어보드에 내가 뜨는가
ok('스코어보드에 참가자 표시', document.querySelectorAll('.board__row').length === 1);

// 5) 참가자 전환 후 기록 → 순위 경쟁
const app = await import('../src/app.js');
document.querySelectorAll('.tab')[2].click(); await wait(200);   // 프로필 화면
const picks = [...document.querySelectorAll('.profilerow__pick')];
picks[1]?.click(); await wait(200);                               // '나'로 전환
document.querySelectorAll('.tab')[0].click(); await wait(200);    // 대결 화면
tap(cards()[3]); await wait(150);                                 // 파랑(order3), LV1 → 225
const rows = [...document.querySelectorAll('.board__row')];
ok('두 명이 스코어보드에 나온다', rows.length === 2, `실제 ${rows.length}`);
ok('점수순 정렬 — 300 > 225', rows[0]?.querySelector('.board__score')?.dataset.value === '300');
ok('선두와의 차 표시', /선두와 75점/.test(rows[1]?.textContent ?? ''), rows[1]?.textContent?.slice(0,60));

// 6) 길게 누르기 = 감소
const hold = (el) => new Promise((r) => {
  el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
  setTimeout(() => { el.dispatchEvent(new PointerEvent('pointerup', { bubbles: true })); r(); }, 600);
});
await hold(cards()[3]); await wait(200);
ok('길게 누르면 −1', document.querySelector('.total__score')?.dataset.value === '0',
   `값=${document.querySelector('.total__score')?.dataset.value}`);

document.getElementById('log').textContent = log.join('\n');
document.body.dataset.done = '1';
</script></body></html>
