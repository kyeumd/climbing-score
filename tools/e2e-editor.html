<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/styles/app.css"></head>
<body><main id="app" class="app"></main><pre id="log"></pre>
<script type="module">
const log = [];
const ok = (n, c, e='') => log.push(`${c?'PASS':'FAIL'} ${n}${e?' — '+e:''}`);
const wait = (ms) => new Promise(r => setTimeout(r, ms));
localStorage.clear();
// 검증용 페이지는 서버에 붙지 않는다. 붙으면 가짜 기록이 진짜 방으로 올라간다.
localStorage.setItem('climbing-score/sync', 'off');
const { createGym } = await import('../src/domain/gym.js');
// 기대값은 domain 에서 계산한다. 상수로 박아 두면 기본 점수표가 바뀔 때 엉뚱하게 실패한다.
const { scoreFor } = await import('../src/domain/scoring.js');
const gym = createGym({ name:'테스트짐', gu:'강남구', grades:[
  {label:'빨강',color:'#E23B34'},{label:'노랑',color:'#F2C41D'},{label:'초록',color:'#3FA45B'}]});
gym.favorite = true;
const g = gym.grades.slice().sort((a,b)=>a.order-b.order);
localStorage.setItem('climbing-score/v1', JSON.stringify({
  profiles:[{id:'p1',name:'가',level:1,primaryGymId:gym.id,createdAt:'2026-01-01'}],
  gyms:[gym],
  sessions:[{id:'s1',profileId:'p1',gymId:gym.id,date:'2026-08-10',levelAtTime:1,
             scoreTable:gym.scoreTable,counts:{[g[2].id]:2},memo:''}],
  meta:{version:1,seeded:true},
}));
await import('../src/app.js');
await wait(400);
document.querySelectorAll('.tab')[1].click(); await wait(300);   // 기록 화면
const rowsBefore = document.querySelectorAll('.sessionrow').length;
ok('세션 목록 표시', rowsBefore === 1, `${rowsBefore}개`);
document.querySelector('.sessionrow')?.click(); await wait(300);
ok('편집 모달 열림', !!document.querySelector('.modal'));
const nums = [...document.querySelectorAll('.editrow input')];
ok('등급별 입력칸', nums.length === 3, `${nums.length}개`);
// 초록 2 → 5로
nums[2].value = '5'; nums[2].dispatchEvent(new Event('change', {bubbles:true})); await wait(150);
const expected = scoreFor(gym.scoreTable, 1, g[2]) * 5;
ok('합계 즉시 갱신',
   (document.querySelector('.editfoot strong')?.textContent ?? '').includes(expected.toLocaleString('ko-KR')),
   `${document.querySelector('.editfoot strong')?.textContent} / 기대 ${expected}점`);
[...document.querySelectorAll('.modal .btn')].find(b=>b.textContent.includes('저장'))?.click();
await wait(300);
const saved = JSON.parse(localStorage.getItem('climbing-score/v1'));
ok('수정이 저장됨', Object.values(saved.sessions[0].counts)[0] === 5);
ok('모달 닫힘', !document.querySelector('.modal'));
document.getElementById('log').textContent = log.join('\n');
document.body.dataset.done = '1';
</script></body></html>
